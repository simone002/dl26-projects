data:
  egtea_root:      "D:/egtea"
  annotation_dir:  "./data/annotations"
  split:           1
  use_flow:        false
  batch_size:      64
  seq_len:         128
  feat_dim:        1024
  num_workers:     0
  val_size:        2022
  test_size:       0
  val_ratio:       0.1
  split_seed:      42
  sliding_window:  true
  stride:          64
  temporal_aug_range:  5
  temporal_aug_prob:   0.5
  feat_noise_std:      0.05
  feat_drop_prob:      0.1

training:
  lr:              0.0004
  weight_decay:    0.005
  label_smoothing: 0.1
  max_epochs:      100
  smooth_weight:   0.2
  boundary_weight: 0.3
